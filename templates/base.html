<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blockchain Simulator{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            color: #ffc107 !important;
        }
        .nav-link.active {
            color: #ffc107 !important;
            font-weight: 500;
        }
        .card {
            border-radius: 0.75rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .footer {
            padding: 1rem 0;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">Blockchain Simulator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/transactions' %}active{% endif %}" href="/transactions">Transactions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/mining' %}active{% endif %}" href="/mining">Mining</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/attacks' %}active{% endif %}" href="/attacks">Attacks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/chainex' %}active{% endif %}" href="/chainex">Blockchain</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5 mb-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer bg-light">
        <div class="container">
            &copy; 2025 Blockchain Simulator. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
