{% extends "base.html" %}

{% block title %}Blockchain Explorer{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4">Blockchain Explorer</h1>
    
    <div class="card mb-4">
        <div class="card-header bg-info text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Node Balances</h5>
                <button id="refreshBalances" class="btn btn-sm btn-light">
                    <i class="bi bi-arrow-clockwise"></i> Refresh Balances
                </button>
            </div>
        </div>
        <div class="card-body">
            <div id="balancesContainer" class="mb-3"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Blockchain Contents</h5>
                <button id="refreshChain" class="btn btn-sm btn-light">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <span class="badge bg-info">Total Blocks: <span id="blockCount">0</span></span>
            </div>
            <div id="chainContainer" class="accordion">
                <!-- Blocks will be inserted here by JavaScript -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetchChain();
        fetchBalances();
        
        document.getElementById('refreshChain').addEventListener('click', function() {
            fetchChain();
        });
        document.getElementById('refreshBalances').addEventListener('click', function() {
            fetchBalances();
        });
    });

    function fetchChain() {
        fetch('/chain')
            .then(response => response.json())
            .then(data => {
                document.getElementById('blockCount').textContent = data.length;
                renderChain(data.chain);
            })
            .catch(error => {
                console.error('Error fetching chain:', error);
                alert('Failed to load blockchain data');
            });
    }

    function fetchBalances() {
        fetch('/balances')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('balancesContainer');
                container.innerHTML = '<h6>Node Balances:</h6>';
                for (const [node, balance] of Object.entries(data.balances)) {
                    container.innerHTML += `<p><strong>${node}:</strong> ${balance} coins</p>`;
                }
            })
            .catch(error => {
                console.error('Error fetching balances:', error);
                alert('Failed to load balances');
            });
    }

    function renderChain(chain) {
        const container = document.getElementById('chainContainer');
        container.innerHTML = '';
        
        chain.forEach(block => {
            const blockId = `block-${block.index}`;
            const blockElement = document.createElement('div');
            blockElement.className = 'accordion-item';
            blockElement.innerHTML = `
                <h2 class="accordion-header" id="heading-${block.index}">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" 
                            data-bs-target="#${blockId}" aria-expanded="false" aria-controls="${blockId}">
                        Block #${block.index} | Hash: ${block.hash.substring(0, 16)}... | 
                        ${block.transactions.length} Transactions
                    </button>
                </h2>
                <div id="${blockId}" class="accordion-collapse collapse" aria-labelledby="heading-${block.index}">
                    <div class="accordion-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Timestamp:</strong> ${new Date(block.timestamp * 1000).toLocaleString()}</p>
                                <p><strong>Previous Hash:</strong> ${block.previous_hash}</p>
                                <p><strong>Nonce:</strong> ${block.nonce}</p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Block Hash:</strong> ${block.hash}</p>
                                <p><strong>Merkle Root:</strong> ${calculateMerkleRoot(block.transactions)}</p>
                            </div>
                        </div>
                        <h6 class="mt-3">Transactions:</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Sender</th>
                                        <th>Receiver</th>
                                        <th>Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${renderTransactions(block.transactions)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(blockElement);
        });
    }

    function renderTransactions(transactions) {
        return transactions.map(tx => `
            <tr>
                <td>${tx.id.substring(0, 8)}...</td>
                <td>${tx.sender}</td>
                <td>${tx.receiver}</td>
                <td>${tx.amount}</td>
            </tr>
        `).join('');
    }

    function calculateMerkleRoot(transactions) {
        if (transactions.length === 0) return '0';
        const txHashes = transactions.map(tx => 
            CryptoJS.SHA256(tx.id + tx.sender + tx.receiver + tx.amount).toString()
        );
        return txHashes.join('').substring(0, 16) + '...';
    }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
{% endblock %}
